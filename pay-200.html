<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michie Auto Detailing LLC - Payment Notice</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- Main Centered Payment Card -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200/80 overflow-hidden transition-all">
        
        <!-- Subtle Top Accent Bar -->
        <div class="h-2 bg-slate-900 w-full"></div>

        <div class="p-6 sm:p-8 text-center">
            
            <!-- Brand / Shield Icon for Trustworthiness -->
            <div class="mx-auto mb-5 w-14 h-14 bg-slate-100 text-slate-800 rounded-2xl flex items-center justify-center shadow-inner border border-slate-200/60">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
                </svg>
            </div>

            <!-- Business Name Heading -->
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight mb-6">
                Michie Auto Detailing LLC
            </h1>

            <!-- Payment Notice Box -->
            <div class="bg-amber-50/90 border border-amber-200/80 rounded-xl p-4 sm:p-5 mb-7 text-left sm:text-center shadow-sm">
                <div class="flex flex-col sm:items-center gap-2">
                    <span class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-amber-800 bg-amber-100/80 px-2.5 py-1 rounded-full w-fit">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                        </svg>
                        Service Adjustment Notice
                    </span>
                    <p class="text-base sm:text-lg font-medium text-slate-800 leading-relaxed mt-1">
                        Additional payment of <span class="font-bold text-slate-950">$200.00</span> required for excessive stains and pet hair
                    </p>
                </div>
            </div>

            <!-- Call to Action Prompt -->
            <p class="text-sm sm:text-base font-medium text-slate-600 mb-3">
                Make your payment here:
            </p>

            <!-- Prominent Styled Green Payment Button -->
            <a href="https://pay.michieauto.com/pay-200" 
               target="_blank" 
               rel="noopener noreferrer"
               class="group w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold text-base sm:text-lg py-3.5 px-6 rounded-xl shadow-md shadow-emerald-600/20 hover:shadow-lg hover:shadow-emerald-600/30 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-emerald-500/40">
                <span>Pay Now</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 transition-transform duration-200 group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
            </a>

            <!-- Secure Link Indicator -->
            <p class="mt-3 text-xs text-slate-400 flex items-center justify-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-emerald-600" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                </svg>
                <span>pay.michieauto.com</span>
            </p>

        </div>

        <!-- Card Footer with Contact Information -->
        <footer class="bg-slate-50 border-t border-slate-200/80 px-6 py-4 text-center">
            <p class="text-sm sm:text-base text-slate-600">
                Questions? Call 
                <a href="tel:4052955189" 
                   class="font-semibold text-slate-900 hover:text-emerald-700 underline decoration-slate-300 hover:decoration-emerald-600 underline-offset-4 transition-colors">
                    (405) 295-5189
                </a>
            </p>
        </footer>

    </main>

</body>
</html>
