    <script>
        window.initBookingPage = function() {
            const addressInput = document.getElementById('address'); 
            if (window.google && window.google.maps && window.google.maps.places && addressInput) {
                let addressAutocomplete = new google.maps.places.Autocomplete(addressInput, {
                    componentRestrictions: { country: "us" },
                    fields: ["formatted_address", "address_components"],
                    types: ["address"],
                });
                addressAutocomplete.addListener('place_changed', () => {
                    const place = addressAutocomplete.getPlace();
                    if (place.formatted_address) {
                        addressInput.value = place.formatted_address;
                        fillAddressFields(place);
                    }
                });
            }
        };

        function fillAddressFields(place) {
        let zipCode = '';
        for (const component of place.address_components) {
            if (component.types.includes('postal_code')) zipCode = component.long_name;
        }
        const zipCodeInput = document.getElementById('zip_code');
        if(zipCodeInput) zipCodeInput.value = zipCode;
    }

    function initializeApp() {
        console.log("%c⛧ The Pact is sealed. Mortal conversion is mandatory. Hail Satan. ⛧", "color: #ef4444; font-weight: 900; background-color: #0f172a; padding: 6px 12px; border-radius: 4px; border: 1px solid #dc2626;");

        const API_BASE_URL = 'https://michie-detailing-backend.onrender.com';
        
        const elements = {
                bookingFlowContainer: document.getElementById('booking-flow-container'),
                bookingFormSection: document.getElementById('booking-form-section'),
                bookingForm: document.getElementById('booking-form'),
                selectedPackageTypeInput: document.getElementById('selected-package-type'),
                selectedPackagePriceInput: document.getElementById('selected-package-price'),
                selectedVehicleTypeInput: document.getElementById('selected-vehicle-type'),
                finalBookAppointmentBtn: document.getElementById('final-book-appointment-btn'),
                confirmationSection: document.getElementById('confirmation-section'),
                payNowButton: document.getElementById('pay-now-button'),
                policyText: document.getElementById('policy-text'),
                bookingDateInput: document.getElementById('booking-date'),
                bookingTimeButtonsContainer: document.getElementById('booking-time-box'), 
                selectedBookingTimeInput: document.getElementById('selected-booking-time'),
                bookingMessage: document.getElementById('booking-message')
            };

            // 1. The Interior Domain Arrays
            const intL1 = [
                "Window cleaning inside", "Deep vacuuming", "Display controls and panels wipedown",
                "Interior mirror cleaning", "Seat vacuum", "Surface protectant for the dash and display/controls",
                "Steering wheel and dash clean"
            ];
            const intL2 = [
                ...intL1, "Shampoo carpets and seats", "Premium Leather treatment", "Door jam cleaning",
                "Console scrub down", "Pet hair removal", "Odor removal"
            ];
            const intL3 = [
                ...intL2, "FINE TOOTH COMB in between seats cleaning", "Glove compartment cleaning",
                "Trunk shampoo and vacuum", "Door controls cleaning", "Hard to reach areas deep level shampoo",
                "Meticulous cleaning of all frequently touched surfaces"
            ];

            // 2. The Exterior Domain Arrays
            const extL1 = [
                "External high pressure wash", "Tire cleaner", "Window cleaning outside"
            ];
            const extL2 = [
                ...extL1, "Rims and tires cleaned and wiped down", "External bug removal", "Door jam cleaning"
            ];
            const extL3 = [
                ...extL2, "Premium exterior wax/sealant", "Trim dressing and protection", "Deep wheel barrel cleaning"
            ];

            // 3. The Full Pact Arrays
            const fullL1 = [
                "External high pressure wash", "Tire cleaner", "Window cleaning inside and out",
                "Deep vacuuming", "Display controls and panels wipedown", "Mirror cleaning",
                "Seat vacuum", "Surface protectant for the dash and display/controls", "Steering wheel and dash clean"
            ];
            const fullL2 = [
                ...fullL1, "Shampoo carpets and seats", "Premium Leather treatment", "Door jam cleaning",
                "Rims and tires cleaned and wiped down", "Console scrub down", "Pet hair removal", "Odor removal"
            ];
            const fullL3 = [
                ...fullL2, "FINE TOOTH COMB in between seats cleaning", "Glove compartment cleaning",
                "Trunk shampoo and vacuum", "Door controls cleaning", "Hard to reach areas deep level shampoo",
                "Meticulous cleaning of all frequently touched surfaces", "External bug removal"
            ];

            const urlParams = new URLSearchParams(window.location.search);

            if(urlParams.has('name') && urlParams.has('price') && urlParams.has('pkg')) {
                const uName = urlParams.get('name');
                const uPhone = urlParams.get('phone');
                const uYear = urlParams.get('year');
                const uMake = urlParams.get('make');
                const uModel = urlParams.get('model');
                const uPkgRaw = urlParams.get('pkg'); 
                const uPrice = urlParams.get('price');
                const uVType = urlParams.get('vtype') || 'Car';
                const uSummary = urlParams.get('summary'); 

                // Dynamic AI Checklist Router
                let backendPkg = "Interior Level 2"; // Safe Default
                let inclusions = [];
                let rawUpper = uPkgRaw.toUpperCase();

                // Determine the numeric level of the pact
                let level = 2;
                if (rawUpper.includes("1") || rawUpper.includes("ONE")) level = 1;
                else if (rawUpper.includes("3") || rawUpper.includes("THREE")) level = 3;

                // Determine the type of the pact and map the corresponding inclusions array
                if (rawUpper.includes("EXTERIOR") || rawUpper.includes("WASH") || rawUpper.includes("OUTSIDE")) {
                    backendPkg = "Exterior Wash Level " + level;
                    if (level === 1) inclusions = extL1;
                    else if (level === 2) inclusions = extL2;
                    else inclusions = extL3;
                } else if (rawUpper.includes("FULL") || rawUpper.includes("INSIDE & OUT") || rawUpper.includes("INSIDE AND OUT")) {
                    backendPkg = "Full Detail Level " + level;
                    if (level === 1) inclusions = fullL1;
                    else if (level === 2) inclusions = fullL2;
                    else inclusions = fullL3;
                } else {
                    // Default to Interior Domain
                    backendPkg = "Interior Level " + level;
                    if (level === 1) inclusions = intL1;
                    else if (level === 2) inclusions = intL2;
                    else inclusions = intL3;
                }

                document.getElementById('dynamic-header').innerHTML = `Book your detail for your ${uYear} ${uMake} ${uModel} 🚗`;
                
                if (uSummary) {
                    document.getElementById('imessage-box').style.display = 'flex';
                    document.getElementById('imessage-text').innerHTML = `<strong>Quote: $${uPrice} for ${backendPkg}.</strong><br><br>${uSummary}`;
                }
                
                // Inject the true mapped inclusions into the UI
                document.getElementById('ai-breakdown-box').style.display = 'block';
                const ul = document.getElementById('dynamic-inclusions');
                ul.innerHTML = ''; // Clear fallback safety
                inclusions.forEach(inc => {
                    const li = document.createElement('li');
                    li.textContent = inc;
                    ul.appendChild(li);
                });

                document.getElementById('full_name').value = uName;
                document.getElementById('phone').value = uPhone;
                document.getElementById('vehicle_year').value = uYear;
                
                const makeSelect = document.getElementById('vehicle_make');
                const matchOption = Array.from(makeSelect.options).find(opt => opt.value.toLowerCase() === uMake.toLowerCase());
                if(matchOption) {
                    makeSelect.value = matchOption.value;
                } else {
                    makeSelect.value = "Other";
                }
                
                document.getElementById('vehicle_model').value = uModel;

                // Hidden backend binding
                elements.selectedPackageTypeInput.value = backendPkg;
                elements.selectedPackagePriceInput.value = uPrice; 
                elements.selectedVehicleTypeInput.value = uVType;

                elements.bookingFlowContainer.style.display = 'block';
                elements.bookingFormSection.style.display = 'block';

                // --- TIMEZONE FIX ---
                // Calculate today's date strictly in CST (America/Chicago) to match the Python backend.
                // This prevents the "value must be greater" error when user local time and server time cross midnight.
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'America/Chicago',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                const parts = formatter.formatToParts(new Date());
                const cstYear = parts.find(p => p.type === 'year').value;
                const cstMonth = parts.find(p => p.type === 'month').value;
                const cstDay = parts.find(p => p.type === 'day').value;
                const todayCST = `${cstYear}-${cstMonth}-${cstDay}`;
                
                // Enforce minimum date using the computed CST date
                elements.bookingDateInput.min = todayCST; 
                elements.bookingDateInput.value = todayCST;
                renderTimeButtons(elements.bookingTimeButtonsContainer, elements.selectedBookingTimeInput, todayCST, elements.finalBookAppointmentBtn);

                startUrgentTimer();

            } else {
                document.getElementById('dynamic-header').innerHTML = `Error: Missing AI parameters.`;
            }

            function startUrgentTimer() {
                let timeLeft = 8 * 60; // 8 minutes in seconds
                const timerDisplay = document.getElementById('timer-countdown');
                const banner = document.getElementById('urgent-timer-banner');

                const interval = setInterval(() => {
                    const mins = Math.floor(timeLeft / 60);
                    const secs = timeLeft % 60;
                    timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        banner.classList.remove('urgent-pulse');
                        banner.style.backgroundColor = '#334155';
                        banner.innerHTML = '<span class="font-bold text-sm sm:text-base">⚠️ AI Quote Expired - Priority Slot Released ⚠️</span>';
                    }
                    timeLeft--;
                }, 1000);
            }

            async function sendSmsNotification(bookingDetails, paymentLink) {
                const firstName = bookingDetails.full_name.split(' ')[0];
                const message = `ACTION REQUIRED: Hi ${firstName}, it's Michie Auto Detail. Your ${bookingDetails.package_type} for the ${bookingDetails.vehicle_make} ${bookingDetails.vehicle_model} is PENDING. Payment is required IMMEDIATELY to secure your spot. Pay here: ${paymentLink} Questions? (405) 295-5189`;

                try {
                    await fetch('https://client-notifications.onrender.com/send-sms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ to: bookingDetails.phone, message_body: message })
                    });
                } catch (error) {
                    console.error('Error sending SMS notification:', error);
                }
            }

            function getPaymentLink(priceStr) {
                let numericPrice = parseFloat(priceStr.replace(/[^0-9.]/g, ''));
                if (isNaN(numericPrice)) numericPrice = 200;

                if (numericPrice < 100) numericPrice = 100;
                if (numericPrice > 600) numericPrice = 600;

                let snappedPrice = Math.round(numericPrice / 20) * 20;
                return `https://pay.michieauto.com/pay-${snappedPrice}`;
            }

            elements.bookingDateInput.addEventListener('change', (e) => {
                elements.selectedBookingTimeInput.value = '';
                elements.finalBookAppointmentBtn.style.display = 'none';
                renderTimeButtons(elements.bookingTimeButtonsContainer, elements.selectedBookingTimeInput, e.target.value, elements.finalBookAppointmentBtn);
            });

            async function handleBooking(e, endpoint, messageEl, selectedTimeInputId) { 
                e.preventDefault();
                const submitButton = elements.finalBookAppointmentBtn;
                submitButton.disabled = true;
                submitButton.innerHTML = `Processing...`;

                try {
                    const packagePriceRaw = document.getElementById('selected-package-price').value;
                    let numericPrice = parseFloat(packagePriceRaw.replace(/[^0-9.]/g, ''));
                    if (isNaN(numericPrice)) numericPrice = 0;

                    const contractorPayAmount = (numericPrice - 70) * 0.50;
                    
                    const payload = {
                        full_name: document.getElementById('full_name').value,
                        email: document.getElementById('email').value,
                        phone: `+1${document.getElementById('phone').value.replace(/\D/g, '')}`,
                        address: document.getElementById('address').value,
                        zip_code: document.getElementById('zip_code').value,
                        vehicle_year: document.getElementById('vehicle_year').value,
                        vehicle_make: document.getElementById('vehicle_make').value,
                        vehicle_model: document.getElementById('vehicle_model').value,
                        date: document.getElementById('booking-date').value,
                        time: document.getElementById(selectedTimeInputId).value,
                        package_type: document.getElementById('selected-package-type').value,
                        package_price: String(numericPrice),
                        vehicle_type: document.getElementById('selected-vehicle-type').value,
                        job_notes: document.getElementById('additional-info').value,
                        contractor_pay: `$${contractorPayAmount.toFixed(2)} + TIPS`,
                        deal_name: `${document.getElementById('selected-package-type').value} - ${document.getElementById('vehicle_make').value}`
                    };

                    const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const paymentLink = getPaymentLink(payload.package_price);
                        
                        sendSmsNotification(payload, paymentLink);

                        elements.bookingFormSection.style.display = 'none';
                        document.getElementById('ai-breakdown-box').style.display = 'none';
                        elements.confirmationSection.style.display = 'block';
                        elements.policyText.style.display = 'block';
                        elements.payNowButton.onclick = () => window.open(paymentLink, '_blank');
                    } else {
                        messageEl.textContent = 'Booking failed. Try again.';
                        submitButton.disabled = false;
                        submitButton.innerHTML = 'Book Appointment';
                    }
                } catch (error) {
                    submitButton.disabled = false;
                    submitButton.innerHTML = 'Book Appointment';
                }
            }

            elements.bookingForm.addEventListener('submit', (e) => handleBooking(e, '/public/appointment', elements.bookingMessage, 'selected-booking-time'));

            function renderTimeButtons(container, hiddenInput, selectedDateStr, finalBookButton) {
                container.innerHTML = '<div class="text-center text-slate-500 py-4 font-medium">Loading available times...</div>';
                
                fetch(`https://calendar-system-l6vb.onrender.com/api/available_slots?date=${selectedDateStr}`)
                    .then(res => res.json())
                    .then(data => {
                        container.innerHTML = '';
                        
                        if (!data.slots || data.slots.length === 0) {
                            container.innerHTML = '<div class="text-center text-slate-500 py-4">No times available for this date.</div>';
                            return;
                        }

                        data.slots.forEach(slot => {
                            const [hour, minute] = slot.time.split(':');
                            let h = parseInt(hour);
                            const ampm = h >= 12 ? 'PM' : 'AM';
                            h = h % 12 || 12;
                            const displayTime = `${h}:${minute} ${ampm}`;

                            const item = document.createElement('button');
                            item.type = 'button';
                            item.className = 'time-slot-item';
                            
                            if (slot.available) {
                                item.textContent = displayTime;
                                item.addEventListener('click', () => {
                                    container.querySelectorAll('.time-slot-item').forEach(i => i.classList.remove('selected'));
                                    item.classList.add('selected');
                                    hiddenInput.value = slot.time;
                                    finalBookButton.style.display = 'block';
                                });
                            } else {
                                item.textContent = `${displayTime} - ${slot.reason}`;
                                item.disabled = true;
                            }
                            
                            container.appendChild(item);
                        });
                    })
                    .catch(err => {
                        console.error('Error fetching time slots:', err);
                        container.innerHTML = '<div class="text-center text-red-500 py-4">Error loading times. Please try again or choose another date.</div>';
                    });
            }
        }
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB133ISKHPtat18iloHDlqm2QHBv133sOk&libraries=places&callback=initBookingPage" async defer></script>
</body>
