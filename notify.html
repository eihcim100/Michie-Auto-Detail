<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Dispatcher - Michie Auto Detailing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            width: 100%;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            background-color: #ffffff;
            margin-top: 0.25rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="p-6">

    <!-- Password Gate -->
    <div id="password-gate" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-xl border border-slate-200 mt-10">
        <h2 class="text-2xl font-bold mb-4 text-center text-slate-800">Admin Access 🔒</h2>
        <p class="text-sm text-slate-600 mb-6 text-center">Please enter the password to access the dispatcher.</p>
        <input type="password" id="gate_password" class="w-full mb-4" placeholder="Enter Password">
        <button id="gate_btn" class="btn-primary">Unlock</button>
        <p id="gate_error" class="text-red-500 text-sm mt-2 hidden text-center">Incorrect password.</p>
    </div>

    <div id="app-container" class="hidden max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-xl border border-slate-200">
        <div class="flex items-center gap-4 mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-slate-800">SMS Dispatcher 📱</h1>
        </div>

        <form id="sms-form" class="space-y-6">
            <!-- Basic Information -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="font-medium text-slate-700">Client First Name <span class="text-red-500">*</span></label>
                    <input type="text" id="first_name" placeholder="e.g. John" required>
                </div>
                <div>
                    <label class="font-medium text-slate-700">Client Cell Phone <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" placeholder="(555) 555-5555" required>
                </div>
                <div class="md:col-span-2">
                    <label class="font-medium text-slate-700">Vehicle Year, Make, & Model <span class="text-slate-400 font-normal">(Optional)</span></label>
                    <input type="text" id="vehicle_info" placeholder="e.g. 2020 Honda Civic">
                </div>
            </div>

            <!-- Message Type Selection -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                <label class="font-medium text-slate-700 block mb-3 text-lg">Select Message Type <span class="text-red-500">*</span></label>
                <div class="space-y-3">
                    <!-- Added AI Instant Quote Option -->
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="message_type" value="ai_quote" class="w-5 h-5 text-blue-600" required>
                        <span class="text-slate-700 font-medium">AI Instant Quote Link ✨</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="message_type" value="interior" class="w-5 h-5 text-blue-600">
                        <span class="text-slate-700 font-medium">Interior Detail Link</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="message_type" value="full" class="w-5 h-5 text-blue-600">
                        <span class="text-slate-700 font-medium">Full Detail Link</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="message_type" value="photo_request" class="w-5 h-5 text-blue-600">
                        <span class="text-slate-700 font-medium">Photo Request Text</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="radio" name="message_type" value="confirmation" class="w-5 h-5 text-blue-600">
                        <span class="text-slate-700 font-medium">Appointment Confirmation Text</span>
                    </label>
                </div>
            </div>

            <!-- Conditional Confirmation Fields -->
            <div id="confirmation-fields" class="hidden bg-blue-50 p-4 rounded-lg border border-blue-100 space-y-4">
                <h3 class="font-bold text-blue-800 border-b border-blue-200 pb-2">Confirmation Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="font-medium text-slate-700">Date Booked <span class="text-red-500">*</span></label>
                        <input type="date" id="conf_date">
                    </div>
                    <div>
                        <label class="font-medium text-slate-700">Time Booked <span class="text-red-500">*</span></label>
                        <select id="conf_time_standard">
                            <option value="">Select Time...</option>
                            <option value="08:00">8:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="17:00">5:00 PM</option>
                        </select>
                        <select id="conf_time_custom" class="hidden">
                            <option value="">Select Custom Time...</option>
                            <option value="06:00">6:00 AM</option>
                            <option value="07:00">7:00 AM</option>
                            <option value="08:00">8:00 AM</option>
                            <option value="09:00">9:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">1:00 PM</option>
                            <option value="14:00">2:00 PM</option>
                            <option value="15:00">3:00 PM</option>
                            <option value="16:00">4:00 PM</option>
                            <option value="17:00">5:00 PM</option>
                            <option value="18:00">6:00 PM</option>
                            <option value="19:00">7:00 PM</option>
                            <option value="20:00">8:00 PM</option>
                            <option value="21:00">9:00 PM</option>
                        </select>
                        <label class="flex items-center gap-2 text-sm text-slate-600 mt-2 cursor-pointer">
                            <input type="checkbox" id="custom_time_toggle" class="w-4 h-4"> Custom Time
                        </label>
                    </div>
                    <div>
                        <label class="font-medium text-slate-700">Service Booked <span class="text-red-500">*</span></label>
                        <select id="conf_service">
                            <option value="">Select Service...</option>
                            <option value="Interior Only level 1">Interior Only level 1</option>
                            <option value="Interior Only level 2">Interior Only level 2</option>
                            <option value="Interior Only level 3">Interior Only level 3</option>
                            <option value="Level 1 Detail">Level 1 Detail</option>
                            <option value="Level 2 Detail">Level 2 Detail</option>
                            <option value="Level 3 Detail">Level 3 Detail</option>
                            <option value="Custom detail service">Custom detail service</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-medium text-slate-700">Vehicle Type <span class="text-red-500">*</span></label>
                        <select id="conf_vehicle_type">
                            <option value="">Select Type...</option>
                            <option value="Car">Car</option>
                            <option value="Truck">Truck</option>
                            <option value="SUV">SUV</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Live Preview Area -->
            <div>
                <label class="font-medium text-slate-700 block mb-2">Message Preview:</label>
                <textarea id="message_preview" rows="9" readonly class="bg-gray-100 text-sm text-gray-600 resize-none"></textarea>
            </div>

            <button type="submit" id="send-btn" class="btn-primary" disabled>Fill out required fields to send</button>
            <p id="status-message" class="text-center mt-2 font-medium"></p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('sms-form');
            const typeRadios = document.getElementsByName('message_type');
            const confirmationFields = document.getElementById('confirmation-fields');
            const previewArea = document.getElementById('message_preview');
            const sendBtn = document.getElementById('send-btn');
            const statusMsg = document.getElementById('status-message');

            const firstNameInput = document.getElementById('first_name');
            const phoneInput = document.getElementById('phone');
            const vehicleInfoInput = document.getElementById('vehicle_info');
            const confDateInput = document.getElementById('conf_date');
            
            const confTimeStandard = document.getElementById('conf_time_standard');
            const confTimeCustom = document.getElementById('conf_time_custom');
            const customTimeToggle = document.getElementById('custom_time_toggle');
            
            const confServiceInput = document.getElementById('conf_service');
            const confVehicleTypeInput = document.getElementById('conf_vehicle_type');

            // --- DEEP OBFUSCATED SECURITY ---
            const _0x4d2a = ["!", "a", "l", "i", "n", "a", "m", "2", "c", "k", "o"];
            const _0x1b7e = (arr) => arr.reverse().join("");
            const _0x9f22 = _0x1b7e(_0x4d2a);

            const gateBtn = document.getElementById('gate_btn');
            const gateInput = document.getElementById('gate_password');
            const gateErr = document.getElementById('gate_error');
            
            gateBtn.addEventListener('click', () => {
                const _0x55a1 = gateInput.value;
                if (_0x55a1 === _0x9f22) {
                    document.getElementById('password-gate').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                } else {
                    gateErr.classList.remove('hidden');
                    gateInput.value = "";
                }
            });
            
            gateInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') gateBtn.click();
            });
            // ---------------------------------

            customTimeToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    confTimeStandard.classList.add('hidden');
                    confTimeCustom.classList.remove('hidden');
                    if (!confirmationFields.classList.contains('hidden')) {
                        confTimeStandard.required = false;
                        confTimeCustom.required = true;
                    }
                } else {
                    confTimeCustom.classList.add('hidden');
                    confTimeStandard.classList.remove('hidden');
                    if (!confirmationFields.classList.contains('hidden')) {
                        confTimeCustom.required = false;
                        confTimeStandard.required = true;
                    }
                }
                updatePreview();
            });

            form.addEventListener('input', updatePreview);
            
            typeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'confirmation') {
                        confirmationFields.classList.remove('hidden');
                        confDateInput.required = true;
                        if (customTimeToggle.checked) {
                            confTimeCustom.required = true;
                            confTimeStandard.required = false;
                        } else {
                            confTimeStandard.required = true;
                            confTimeCustom.required = false;
                        }
                        confServiceInput.required = true;
                        confVehicleTypeInput.required = true;
                    } else {
                        confirmationFields.classList.add('hidden');
                        confDateInput.required = false;
                        confTimeStandard.required = false;
                        confTimeCustom.required = false;
                        confServiceInput.required = false;
                        confVehicleTypeInput.required = false;
                    }
                    updatePreview();
                });
            });

            function formatTime(timeStr) {
                if (!timeStr) return '';
                const [hourString, minute] = timeStr.split(':');
                let hour = parseInt(hourString);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                hour = hour % 12 || 12;
                return `${hour}:${minute} ${ampm}`;
            }

            function formatDate(dateStr) {
                if (!dateStr) return '';
                const [year, month, day] = dateStr.split('-');
                return `${month}/${day}/${year}`;
            }

            function generateMessage() {
                const name = firstNameInput.value.trim() || '[NAME]';
                const vehicleRaw = vehicleInfoInput.value.trim();
                const vehicleText = vehicleRaw ? ` ${vehicleRaw}` : ' vehicle';
                const vehiclePhotoText = vehicleRaw ? `the ${vehicleRaw}` : 'your vehicle';
                const vehicleMakeModel = vehicleRaw || '[VEHICLE MAKE AND MODEL]';
                
                let selectedType = null;
                for (const radio of typeRadios) {
                    if (radio.checked) selectedType = radio.value;
                }

                if (!selectedType) return "Please select a message type.";

                // AI Instant Quote Text Script
                if (selectedType === 'ai_quote') {
                    return `Hi ${name}! It's Michie Auto Detail. Here's a link to get your AI Instant detail quote for your ${vehicleMakeModel}. https://quote.michieauto.com/ Once you're done we can go over the results. Questions? Call (405) 295-5189`;
                }

                if (selectedType === 'interior') {
                    return `Hey ${name} it's Andrew with Michie Auto Detailing! here's a link to book your interior only detail appointment for your${vehicleText} https://michieauto.com/interior`;
                } 
                
                if (selectedType === 'full') {
                    return `Hey ${name} it's Andrew with Michie Auto Detailing! Here's a link to book your auto detail appointment for your${vehicleText} https://michieauto.com/book`;
                }

                if (selectedType === 'photo_request') {
                    return `Hi ${name} It's Michie Auto Detail. Could you send us a few photos of ${vehiclePhotoText} so we can have our detailer take a look? This helps us know what type of treatment and restoration options will work best for your vehicle. Send photos of the carpets, the seats, the dashboard and trunk/hatchback area of the vehicle. You can send your photos to (405) 223-8171 and we'll text you back to confirm we got it. Thanks!`;
                }
                
                if (selectedType === 'confirmation') {
                    const date = formatDate(confDateInput.value) || '[MM/DD/YYYY]';
                    const activeTimeInput = customTimeToggle.checked ? confTimeCustom : confTimeStandard;
                    const time = formatTime(activeTimeInput.value) || '[Time IN 12 hour AM OR PM FORMAT]';
                    const service = confServiceInput.value || '[Package selected]';
                    
                    return `Hi ${name} it's Michie Auto Detailing, Thanks for booking with us, your ${service} detail is confirmed for ${date} at ${time}\n\nHere's a few reminders for your appointment:\n\nPlease remove all important valuables, personal items, documents out of your vehicle before we start detailing. (This includes all gold cash & jewelry, personal documents and registration paperwork) if there is trash you'd like us to throw away, leave it inside!\n\nNote: We will use your residence's power outlet for our shampooer and our detail equipment. Please direct us upon arrival where we should go to connect to the power. We have an extension cable to connect to any outlet outside.\n\nThe detail process can take anywhere from 1-4 hours and you keep the keys! You do not need to be there the entire time while we detail.\n\nIMPORTANT: When we're finished up, we ask before we leave that you check everything over as we care ❤️ about making our clients cars look awesome and meeting your expectations. If we need to correct something, please let us know before we leave. Return trips will result in a $100 transportation fee charged.\n\nYour booking includes (1) free reschedule. If you need to change your appointment date or time please let us know ASAP so we can get you our soonest available slot.\n\nAnd lastly, if you have any questions or concerns call our 24/7 support line at (405) 295-5189\n\nThank you for booking with us!\nMichie Auto Detail\nhttps://michieauto.com\n(405) 295-5189`;
                }
            }

            function updatePreview() {
                const message = generateMessage();
                previewArea.value = message;
                const isFormValid = form.checkValidity();
                if (isFormValid) {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send Text Message 🚀';
                } else {
                    sendBtn.disabled = true;
                    sendBtn.textContent = 'Fill out required fields to send';
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const phoneRaw = phoneInput.value;
                const formattedPhone = `+1${phoneRaw.replace(/\D/g, '')}`; 
                const messageToSend = generateMessage();

                sendBtn.disabled = true;
                sendBtn.textContent = 'Sending...';
                statusMsg.textContent = '';

                try {
                    const response = await fetch('https://client-notifications.onrender.com/send-sms', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            to: formattedPhone, 
                            message_body: messageToSend 
                        })
                    });

                    if (response.ok) {
                        statusMsg.textContent = '✅ Message sent successfully!';
                        statusMsg.className = 'text-center mt-2 font-medium text-green-600';
                    } else {
                        throw new Error('Failed to send');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    statusMsg.textContent = '❌ Error sending message. Please try again.';
                    statusMsg.className = 'text-center mt-2 font-medium text-red-600';
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Send Text Message 🚀';
                }
            });

            updatePreview();
        });
    </script>
</body>
</html>
